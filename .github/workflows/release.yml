name: Release

on:
  push:
    tags:
      - "v*"
  # Déclenchement manuel : build de test (artifact seulement, pas de release)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name DOFUS-Window-Switcher --icon DWM.ico
          --add-data "DWM.ico;."
          --add-data "classes;classes"
          --add-data "font;font"
          --collect-data customtkinter
          configure.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOFUS-Window-Switcher
          path: dist/DOFUS-Window-Switcher.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DOFUS-Window-Switcher.exe
          generate_release_notes: true
